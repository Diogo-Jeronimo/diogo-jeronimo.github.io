<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>🎳 2D</title>
		<script src="matter.min.js"></script>
		<style>
body {
	background-color: black;
	color: white;
	font-size: xx-large;
	font-family: sans-serif;
}
input, button {
	font-size: xx-large;
}
table {
	border-collapse: collapse;
	border: 1px solid white;
	text-align: center;
}
td {
	padding: 4px;
	border: 1px solid white;
	min-width: 64px;
}
td:empty::before {
	content: " ";
}
.split {
	text-decoration-line: underline overline;
	text-decoration-color: red;
}
#barriers {
	width: 25px;
	height: 25px;
}
select {
	font-size: xx-large;
}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas> <br/>
		<table>
			<tbody>
				<tr>
					<td></td><td></td>
					<td></td><td></td>
					<td></td><td></td>
					<td></td><td></td>
					<td></td><td></td><td></td>
					<td rowspan="2">0</td>
					<td rowspan="2">50<br>150</td>
				</tr>
				<tr>
					<td colspan="2">0</td>
					<td colspan="2">0</td>
					<td colspan="2">0</td>
					<td colspan="2">0</td>
					<td colspan="3">0</td>
				</tr>
			</tbody>
		</table> <br/>
		<select id="scoring">
			<option value="traditional">Traditional Scoring +S</option>
			<option value="current">Current Frame Scoring +S</option>
			<option value="custom">Custom Current Frame</option>
			<option value="total">Total Pinfall</option>
		</select>
		<lable>Rows:
			<input id="rows" type="number" min="1" max="8" step="1" value="4"/>
		</label>
		<lable>Frames:
			<input id="frames" type="number" min="1" max="10" step="1" value="5"/>
		</label>
		<button id="button" type="button">Start</button><br/>
		<select id="bot">
			<option value="">--Select Bot--</option>
			<option value="beginner">Beginner</option>
			<option value="random">Random</option>
			<option value="curve">Curve</option>
			<option value="line">Line</option>
		</select>
		<label>Barriers:
			<input id="barriers" type="checkbox" switch/>
		</label>
		<script>
"use strict";
const {Mouse, Composite, Bodies, Body, Events, Render, Engine, Runner, Query, Vector, Common} = Matter;
const scoringSelect = document.getElementById("scoring");
const table = document.querySelector("table");
const rowsNumberInput = document.getElementById("rows");
const framesNumberInput = document.getElementById("frames");
const startButton = document.getElementById("button");
const botSelect = document.getElementById("bot");
const barrierCheckbox = document.getElementById("barriers"); barrierCheckbox.checked = false;
const width = 1800, ballRadius = 22, pinRadius = 12, pinCenterDistance = 60, xPinCenterDistance = Math.sqrt(pinCenterDistance * pinCenterDistance - (pinCenterDistance / 2) ** 2), gutterHeight = ballRadius * 2, frameTries = 2, backRowX = width - 50;
let frame, frameTry, numFrames, numRows, gameScoring, pinsInTriangle, height, oilEndX, aimPoint;
frame = frameTry = numFrames = numRows = gameScoring = pinsInTriangle = height = oilEndX = aimPoint = null;

const engine = Engine.create({gravity: {scale: 0}, constraintIterations: 0, positionIterations: 6, velocityIterations: 4});

const render = Render.create({
	canvas: document.getElementById("canvas"),
	engine: engine,
	options: {hasBounds: true, height: height, width: width, wireframes: false, background: "#440", showAngleIndicator: true}
});

const mouse = Mouse.create(render.canvas);

let ball = null, ballType = "hook";
const createBall = function(y) {
	switch(ballType) {
		case "hook":
			ball = Bodies.circle(200, y ?? height/2, ballRadius, {
				label: "ball", density: 0.002, restitution: 0.2,
				render: {strokeStyle: "#300", lineWidth: 5, fillStyle: "darkred"}
			}); break;
		case "line":
			ball = Bodies.circle(200, y ?? height/2, ballRadius, {
				label: "ball", density: 0.004, restitution: 0,
				render: {strokeStyle: "#030", lineWidth: 5, fillStyle: "green"}
			}); break;
		case "big":
			ball = Bodies.circle(200, y ?? height/2, ballRadius * 2, {
				label: "ball", density: 0.004, restitution: 0,
				render: {strokeStyle: "#222", lineWidth: 5, fillStyle: "#555"}
			}); break;
		case "bounce":
			ball = Bodies.circle(200, y ?? height/2, ballRadius, {
				label: "ball", density: 0.001, restitution: 1, friction: 0, frictionAir: 0, frictionStatic: 0,
				render: {strokeStyle: "#303", lineWidth: 5, fillStyle: "indigo"}
			}); break;
		default:
			ball = null;
	}
	Composite.add(engine.world, ball);
};

let standingPins = [];
const createPins = function() {
	standingPins.length = 0;
	for(let i = 0; i < numRows; i++) {
		const x = backRowX - ((numRows - i - 1) * xPinCenterDistance);
		const pinsInRow = i + 1;
		for(let j = 0; j < pinsInRow; j++) {
			const y = height / 2 + (j - (pinsInRow - 1) / 2) * pinCenterDistance;
			const pin = Bodies.circle(x, y, pinRadius, {label: "pin", restitution: 0.9, render: {fillStyle: "#fff", lineWidth: 1, strokeStyle: "#000"}});
			Composite.add(engine.world, pin);
			standingPins.push(pin);
		}
	}
};

const pinWalls = [];
const createPinWalls = function() {
	const startX = backRowX - xPinCenterDistance * numRows, endX = width;
	pinWalls.push(Bodies.rectangle(startX + (endX - startX)/2, -wallThickness/2, endX - startX, wallThickness, {isStatic: true, restitution: 0}));
	pinWalls.push(Bodies.rectangle(startX + (endX - startX)/2, height + wallThickness/2, endX - startX, wallThickness, {isStatic: true, restitution: 0}));

	Composite.add(engine.world, pinWalls);
};

const wallThickness = width * 10, barrierThickness = width * 10;
const walls = [
	Bodies.rectangle(width/2, -wallThickness/2, wallThickness, wallThickness, {
		isStatic: true, restitution: 0 //top
	}),
	Bodies.rectangle(width/2, wallThickness/2, wallThickness, wallThickness, {
		isStatic: true, restitution: 0 //bottom
	}),
	Bodies.rectangle(-wallThickness/2, wallThickness/2, wallThickness, wallThickness, {
		isStatic: true, restitution: 0 //left
	}),
	Bodies.rectangle(width + wallThickness/2, wallThickness/2, wallThickness, wallThickness, {
		isStatic: true, restitution: 0 //right
	})
];
const barriers = [
	Bodies.rectangle(200 + (width - 200) / 2, gutterHeight - barrierThickness / 2, width - 200, barrierThickness, {
		isStatic: true, restitution: 0, render: {fillStyle: "#222", lineWidth: 0} //top
	}),
	Bodies.rectangle(200 + (width - 200) / 2, gutterHeight + barrierThickness / 2, width - 200, barrierThickness, {
		isStatic: true, restitution: 0, render: {fillStyle: "#222", lineWidth: 0} //bottom
	})
];
barrierCheckbox.onchange = function() {
	if(barrierCheckbox.checked) {
		Composite.add(engine.world, walls.concat(barriers));
	} else {
		Composite.remove(engine.world, walls.concat(barriers));
	}
};

const runner = Runner.create();

const prepareFrame = function() {
	Composite.clear(engine.world, true);
	createPins();
	createBall();
};

const prepareNextTry = function(fallenPins) {
	Composite.remove(engine.world, ball);
	Composite.remove(engine.world, fallenPins);
	createBall();
};

const endGame = function() {
	Composite.clear(engine.world, true);
	Composite.remove(engine.world, pinWalls);
	pinWalls.length = 0;
	Runner.stop(runner);
	Render.stop(render);
};

startButton.onclick = function() {
	endGame();

	frame = frameTry = 1;
	numFrames = framesNumberInput.valueAsNumber, numRows = rowsNumberInput.valueAsNumber, gameScoring = scoringSelect.value;
	height = ballRadius * 4 + Math.max(numRows - 1, 2) * pinCenterDistance + pinRadius * 3;
	oilEndX = backRowX - ((numRows + 6) * xPinCenterDistance);
	pinsInTriangle = numRows * (numRows + 1) / 2;
	aimPoint = Vector.create(width/3, height/2);

	let z = "<tbody><tr>";
	switch(gameScoring) {
		case "traditional": {
			for(let i = 0; i < numFrames - 1; i++) {
				z += "<td></td><td></td>";
			}
			z += "<td></td><td></td><td></td><td rowspan='2'>0</td><td rowspan='2'>";
			z += numFrames * pinsInTriangle + "<br>" + 3 * numFrames * pinsInTriangle;
			z += "</td></tr><tr>";
			for(let i = 0; i < numFrames - 1; i++) {
				z += "<td colspan='2'>0</td>";
			}
			z += "<td colspan='3'>0</td></tr></tbody>";
			break;
		}
		case "current": {
			for(let i = 0; i < numFrames; i++) {
				z += "<td></td><td></td>";
			}
			z += "<td rowspan='2'>0</td><td rowspan='2'>";
			z += numFrames * pinsInTriangle + "<br>" + 3 * numFrames * pinsInTriangle;
			z += "</td></tr><tr>";
			for(let i = 0; i < numFrames; i++) {
				z += "<td colspan='2'>0</td>";
			}
			z += "</tr></tbody>";
			break;
		}
		case "custom": {
			for(let i = 0; i < numFrames; i++) {
				z += "<td></td><td></td>";
			}
			z += "<td rowspan='2'>0</td><td rowspan='2'>";
			z += numFrames * pinsInTriangle + "<br>" + numFrames *  Math.round(2.5 * pinsInTriangle);
			z += "</td></tr><tr>";
			for(let i = 0; i < numFrames; i++) {
				z += "<td colspan='2'>0</td>";
			}
			z += "</tr></tbody>";
			break;
		}
		case "total": {
			for(let i = 0; i < numFrames; i++) {
				z += "<td></td><td></td>";
			}
			z += "<td rowspan='2'>0</td><td rowspan='2'>";
			z += numFrames * pinsInTriangle + "<br></td></tr><tr>";
			for(let i = 0; i < numFrames; i++) {
				z += "<td colspan='2'>0</td>";
			}
			z += "</tr></tbody>";
			break;
		}
		default:
			z += "</tr></tbody>";
	}
	table.innerHTML = z;

	Render.setSize(render, width, height);

	Body.setPosition(walls[1], Vector.create(walls[1].position.x, height + wallThickness/2));
	Body.setPosition(barriers[1], Vector.create(barriers[1].position.x, height - gutterHeight + barrierThickness / 2));
	createBall();
	createPins();
	createPinWalls();
	rotationPositionPoint = null, shotTimestamp = null;

	Render.run(render);
	Runner.run(runner, engine);
};

let rotationPositionPoint = null, shotTimestamp = null;
Events.on(render, "beforeRender", function() {
	if(shotTimestamp == null && rotationPositionPoint == null) {
		Body.setPosition(ball, Vector.create(200, mouse.position.y));
	}
});

Events.on(render, "afterRender", function() {
	const ctx = render.context;
	ctx.lineWidth = 1; ctx.strokeStyle = "black"; ctx.beginPath();
	//start of lane line
	ctx.moveTo(200, 0); ctx.lineTo(200, height);
	//gutter lines
	ctx.moveTo(200, gutterHeight); ctx.lineTo(width, gutterHeight);
	ctx.moveTo(200, height - gutterHeight); ctx.lineTo(width, height - gutterHeight);
	//where "oil" ends line
	ctx.moveTo(oilEndX, gutterHeight); ctx.lineTo(oilEndX, height - gutterHeight);
	ctx.stroke();

	if(shotTimestamp == null) {
		if(rotationPositionPoint == null) {
			//draw rotation meter
			const gradient = ctx.createLinearGradient(10, 0, 200, 0);
			gradient.addColorStop(0, "red"); gradient.addColorStop(1/4, "yellow");
			gradient.addColorStop(2/4, "green"); gradient.addColorStop(3/4, "yellow");
			gradient.addColorStop(1, "red");
			ctx.fillStyle = gradient;
			ctx.fillRect(105, 0, Common.clamp(mouse.position.x - 105, -95, 95), 10);

			//draw position lines
			//ctx.beginPath();
			for(let i = 1; i <= 5; i++) {
				const y = gutterHeight + i * (height - gutterHeight * 2) / 6;
				ctx.moveTo(0, y); ctx.lineTo(200, y);
			}
			ctx.stroke();
		} else {
			//draw power meter
			const gradient = ctx.createLinearGradient(10, 0, 200, 0);
			gradient.addColorStop(0, "red"); gradient.addColorStop(1/3, "orange");
			gradient.addColorStop(2/3, "yellow"); gradient.addColorStop(1, "green");
			ctx.fillStyle = gradient;
			ctx.fillRect(200, 0, Common.clamp(mouse.position.x - 200, -190, 0), 10);

			//draw aim line
			//ctx.beginPath();
			const path = Vector.sub(aimPoint, Vector.create(0, mouse.position.y));
			const pathFromBall = Vector.add(ball.position, Vector.mult(Vector.normalise(path), 500));
			ctx.moveTo(ball.position.x, ball.position.y);
			ctx.lineTo(pathFromBall.x, pathFromBall.y);
			//draw position lines
			for(let i = 1; i <= 19; i++) {
				const y = i * height / 20;
				ctx.moveTo(100, y); ctx.lineTo(200, y);
			}
			ctx.stroke();
			/*ctx.strokeStyle = "white"; ctx.beginPath();
			ctx.moveTo(0, height/2); ctx.lineTo(200, height/2);
			ctx.stroke();*/
		}
	}
});

const throwBall = function(x1, y1, x2, y2) {
	Body.setAngularVelocity(ball, (x1 - 105) / 100);
	Body.setPosition(ball, Vector.create(200, y1));
	Body.setVelocity(ball, Vector.sub(aimPoint, Vector.create(0, y2)));
	Body.setSpeed(ball, Common.clamp(200 - x2, 0, 190) / 4);

	rotationPositionPoint = null;
	shotTimestamp = engine.timing.timestamp;
};

render.canvas.onclick = function() {
	if(shotTimestamp == null) {
		if(rotationPositionPoint == null) {
			const x = Common.clamp(mouse.position.x, 10, 200);
			rotationPositionPoint = Vector.create(x, mouse.position.y);
		} else {
			throwBall(rotationPositionPoint.x, rotationPositionPoint.y, mouse.position.x, mouse.position.y);
		}
	}
};

const random = function(offset, min, max) {
	if(max == null) {
		max = min; min = offset; offset = 0;
	}
	if(max == null) {
		max = min; min = 0;
	}
	if(min > max) {
		const t = max; max = min; min = t;
	}
	return offset + Math.random() * (max - min) + min;
};

const botThrowsBall = function() {
	let botOutput = null;
	const headPinY = standingPins[0].position.y;
	if(standingPins.length === 1) {
		switch(botSelect.value) {
			case "curve": botOutput = ["line", 150, headPinY, 100, height / 2]; break;
			case "line": botOutput = ["line", 105, headPinY, 100, height / 2];
		}
	}
	switch(botSelect.value) {
		case "beginner": {
			botOutput = ["line", random(110, 120), random(height/2, -50, 50), random(110, 140), random(height/2, -50, 50)];
			break;
		}
		case "random": {
			botOutput = ["line", random(10, 200), random(gutterHeight, height-gutterHeight), random(10, 200), random(height)];
			break;
		}
		case "curve": {
			if(headPinY - pinCenterDistance * 1.5 > gutterHeight) {
				botOutput ??= ["hook", 200, headPinY - pinCenterDistance * 1.5, random(15, 25), height/2];
			} else {
				botOutput ??= ["hook", 10, headPinY + pinCenterDistance * 1.5, random(15, 25), height/2];
			}
			break;
		}
		case "line": {
			botOutput ??= ["line", 105, random(headPinY, -pinRadius*2, pinRadius*2), 10, height/2];
		}
	}
	if(botOutput != null) {
		const t = botOutput.shift();
		if(ballType != t) {
			ballType = t;
			Composite.remove(engine.world, ball);
			createBall(ball.position.y);
		}
		throwBall(...botOutput);
	}
};

document.addEventListener("keydown", function(event) {
	switch(event?.key) {
		case "1": ballType = "hook"; break;
		case "2": ballType = "line"; break;
		case "3": ballType = "big"; break;
		case "4": ballType = "bounce";
	}
	if(shotTimestamp == null) {
		if(event?.key == "b" || event?.key == "B") {
			botThrowsBall();
		} else { // ball change
			Composite.remove(engine.world, ball);
			createBall(ball.position.y);
		}
	}
});

Events.on(engine, "collisionStart", function(event) {
	for(const pair of event.pairs) {
		if(pair.bodyA.label == "pin" && shotTimestamp != null) {
			pair.bodyA.render.fillStyle = pair.bodyB.label == "ball" ? "forestgreen" : "dimgrey";
			pair.bodyA.label = "fallen";
		}
		if(pair.bodyB.label == "pin" && shotTimestamp != null) {
			pair.bodyB.render.fillStyle = pair.bodyA.label == "ball" ? "forestgreen" : "dimgrey";
			pair.bodyB.label = "fallen";
		}
	}
});

Events.on(engine, "beforeUpdate", function(event) {
	if(ball.position.y < gutterHeight && ball.position.x > 200) {
		Body.setAngularSpeed(ball, 0);
		Body.setVelocity(ball, Vector.create(ball.velocity.x, 0));
		const newDeltaPos = (ball.position.y - gutterHeight/2) / 1.1;
		Body.setPosition(ball, Vector.create(ball.position.x, gutterHeight/2 + newDeltaPos));
	} else if(ball.position.y > height - gutterHeight && ball.position.x > 200) {
		Body.setAngularSpeed(ball, 0);
		Body.setVelocity(ball, Vector.create(ball.velocity.x, 0));
		const newDeltaPos = (ball.position.y - height + gutterHeight/2) / 1.1;
		Body.setPosition(ball, Vector.create(ball.position.x, height - gutterHeight/2 + newDeltaPos));
	}
	// Simulate "hook"
	if(ball.position.x > oilEndX && ballType != "line" && ballType != "big") {
		const rotated = Vector.rotate(ball.velocity, ball.angularVelocity / 20 * engine.timing.timeScale);
		Body.setVelocity(ball, rotated);
		Body.setAngularSpeed(ball, ball.angularSpeed / (1 + 0.01 * engine.timing.timeScale));
	}
	if(ball.position.x < width && ball.position.x > width / 1.8 && ball.position.y > gutterHeight && ball.position.y < height - gutterHeight && standingPins.length > 1) {
		if(Vector.magnitude(ball.velocity) > 10) engine.timing.timeScale = 0.1;
		else if(Vector.magnitude(ball.velocity) < 5) engine.timing.timeScale = 1;
	} else {
		engine.timing.timeScale = 1;
	}
});

const splitOccurred = function() {
	if(numRows < 3) {
		return false;
	}
	const rays = numRows * 2 - 1;
	const startY = height / 2 - (rays - 1) / 2 * pinCenterDistance / 2;
	const bodyDetections = [];
	for(let i = 0; i < rays; i++) {
		const y = startY + i * pinCenterDistance / 2;
		const c = Query.ray(standingPins, Vector.create(width/2, y), Vector.create(width, y));
		bodyDetections.push(c.length > 0);
	}
	let seenDetection = false, seenNotDetectionAfterDetection = false;
	for(const detection of bodyDetections) {
		if(detection) {
			if(seenDetection && seenNotDetectionAfterDetection) {
				return true; //found …true…false…true… which means a split occurred vertically
			}
			seenDetection = true;
		} else if(seenDetection) {
			seenNotDetectionAfterDetection = true;
		}
	}
	return false;
};

const anyBodyOnLaneAboveSpeed = function(speed) {
	return Composite.allBodies(engine.world).some(body =>
		body.speed > speed && body.position.x > 0 && body.position.x < width && body.position.y > 0 && body.position.y < height
	);
};

Events.on(engine, "afterUpdate", function(event) {
	// end shot
	if(shotTimestamp != null && event.timestamp - shotTimestamp > 3000 && !anyBodyOnLaneAboveSpeed(0.1)) {
		// count pins
		const fallenPins = standingPins.filter(pin => pin.label == "fallen");
		standingPins = standingPins.filter(pin => pin.label == "pin");

		//insert score and prepare next roll
		if(frame === numFrames && gameScoring == "traditional") {
			// insert score
			if(standingPins.length === 0) {
				if(frameTry === 1) {
					// strike!
					table.rows[0].cells[(frame - 1) * frameTries].innerText = "X";
					prepareFrame();
				} else if(frameTry == 2) {
					if((table.rows[0].cells[(numFrames - 1) * 2]).innerText == "X") {
						table.rows[0].cells[(frame - 1) * frameTries + 1].innerText = fallenPins.length;
					} else {
						// split conversion!
						if(table.rows[0].cells[(frame - 1) * frameTries].classList.contains("split")) {
							table.rows[0].cells[(frame - 1) * frameTries + 1].innerText = "Y";
						} else { // spare!
							table.rows[0].cells[(frame - 1) * frameTries + 1].innerText = "/";
						}
					}
					prepareFrame();
				} else {
					// game ends
					table.rows[0].cells[(frame - 1) * frameTries + frameTry - 1].innerText = fallenPins.length;
					endGame();
				}
			} else {
				if(frameTry === 1 || (frameTry == 2 && table.rows[0].cells[(numFrames - 1) * 2]).innerText == "X") {
					prepareNextTry(fallenPins);
				} else {
					endGame();
				}
				table.rows[0].cells[(frame - 1) * frameTries + frameTry - 1].innerText = fallenPins.length;
				if(splitOccurred() && frameTry < frameTries) {
					table.rows[0].cells[(frame - 1) * frameTries + frameTry - 1].classList.add("split");
				}
			}
			frameTry++;
		} else {
			// insert score
			if(standingPins.length === 0) {
				if(frameTry === 1) {
					// strike!
					table.rows[0].cells[(frame - 1) * frameTries].innerText = "X";
				} else if(frameTry == 2) {
					// split conversion!
					if(table.rows[0].cells[(frame - 1) * frameTries].classList.contains("split")) {
						table.rows[0].cells[(frame - 1) * frameTries + 1].innerText = "Y";
					} else { // spare!
						table.rows[0].cells[(frame - 1) * frameTries + 1].innerText = "/";
					}
				} else {
					table.rows[0].cells[(frame - 1) * frameTries + frameTry - 1].innerText = fallenPins.length;
				}
				frame++; frameTry = 1;
				if(frame > numFrames) {
					endGame();
				} else {
					prepareFrame();
				}
			} else {
				table.rows[0].cells[(frame - 1) * frameTries + frameTry - 1].innerText = fallenPins.length;
				if(splitOccurred() && frameTry < frameTries) {
					table.rows[0].cells[(frame - 1) * frameTries + frameTry - 1].classList.add("split");
				}
				if(++frameTry > frameTries) {
					frame++; frameTry = 1;
					if(frame > numFrames) {
						endGame();
					} else {
						prepareFrame();
					}
				} else {
					prepareNextTry(fallenPins);
				}
			}
		}

		// update total score
		let sum = 0;
		for(let i = 0; i < numFrames; i++) {
			const frameScore = table.rows[1].cells[i];
			const shots = table.rows[0];
			const shot1 = shots.cells[i * 2];
			const shot2 = shots.cells[i * 2 + 1];
			if(shot1.innerText == "X") {
				let score = pinsInTriangle;
				switch(gameScoring) {
					case "traditional":
						for(let roll = 0, j = 0; roll < 2 /*bonus rolls for X*/ && (i * 2 + 1 + j) < table.rows[0].cells.length - 2; j++) {
							const rollScore = table.rows[0].cells[i * 2 + 1 + j].innerText;
							switch(rollScore) {
								case "": break;
								case "X":
									score += pinsInTriangle; roll++; break;
								case "/": case "Y":
									score = Math.ceil((score + 1) / pinsInTriangle) * pinsInTriangle;
									roll++; break;
								default:
									score += +rollScore; roll++;
							}
						}
						break;
					case "current":
						score *= 3;
						break;
					case "custom":
						score = Math.round(2.5 * score);
						break;
				}
				frameScore.innerText = score;
			} else if(shot2.innerText == "/") {
				let score = pinsInTriangle;
				switch(gameScoring) {
					case "traditional":
						const rollScore = table.rows[0].cells[(i + 1) * 2].innerText;
						score += rollScore == "X" ? pinsInTriangle : +rollScore;
						break;
					case "current":
						score += +shot1.innerText;
						break;
					case "custom":
						score += +shot1.innerText;
						break;
				}
				frameScore.innerText = score;
			} else if(shot2.innerText == "Y") {
				let score = pinsInTriangle;
				switch(gameScoring) {
					case "traditional":
						score += +table.rows[0].cells[i * 2].innerText;
						const rollScore = table.rows[0].cells[(i + 1) * 2].innerText;
						score += rollScore == "X" ? pinsInTriangle : +rollScore;
						break;
					case "current":
						score = score * 2 + +shot1.innerText;
						break;
					case "custom":
						score = Math.round(1.5 * score) + +shot1.innerText;
						break;
				}
				frameScore.innerText = score;
			} else {
				frameScore.innerText = +shot1.innerText + +shot2.innerText;
			}
			sum += +frameScore.innerText;
		}
		table.rows[0].cells[table.rows[0].cells.length - 2].innerText = sum;

		shotTimestamp = null;
		engine.timing.timeScale = 1;
	}
});
