<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=0.8">
		<title>🎳Custom WBT Score Calculator</title>
		<style>
body {
	background-color: black;
	color: white;
	font-family: sans-serif;
}
main {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: space-around;
	gap: 8px;
}
input, button {
	background-color: #333;
	color: white;
	border-width: 1px;
	border-color: white;
	border-radius: 5px;
}
input[type=number] {
	max-width: 8ch;
}
input[type=text] {
	min-width: 30ch;
}
hr {
	border-width: 1px 0px 0px 0px;
	border-color: white;
	min-width: 30ch;
}
table {
	border-collapse: collapse;
	border: 1px solid white;
	text-align: center;
}
th, td {
	padding: 4px;
	border: 1px solid white;
}
ul {
	list-style-type: none;
	padding: 0px;
	margin: 0px;
}
		</style>
	</head>
	<body>
		<main>
			<ul>
				<li>
					<button onclick="this?.parentElement?.remove?.();">X</button>
					<label>Game 1:
						<input type="text" oninput="calculateScores();"/>
						<output>0</output>
					</label>
				</li>
			</ul>
			<button onclick="addGame();">Add game</button>
			<hr/>
			<label>Pins:
				<input id="pins" type="number" min="1" value="10" step="1" required/>
			</label>
			<label>Spare bonus:
				<input id="spare" type="number" min="0" value="10" required/>
			</label>
			<label>Split bonus:
				<input id="split" type="number" min="0" value="5" required/>
			</label>
			<label>Strike bonus:
				<input id="strike" type="number" min="0" value="5" required/>
			</label>
			<button onclick="updateScoring();calculateScores();">Update scoring</button>
			<table></table>
		</main>
		<script>
const numberPinsInput = document.getElementById("pins");
const spareBonusInput = document.getElementById("spare");
const splitBonusInput = document.getElementById("split");
const strikeBonusInput = document.getElementById("strike");
const gamesList = document.querySelector("ul");
const table = document.querySelector("table");
let pins = null, spare = null, split = null, strike = null, nextGameNumber = 2;
const updateScoring = () => {
	pins = numberPinsInput.valueAsNumber, spare = spareBonusInput.valueAsNumber, split = spare + splitBonusInput.valueAsNumber, strike = pins + spare + strikeBonusInput.valueAsNumber;
	let z = `<tbody><tr><th>Points</th><th colspan="${pins + 1}">2nd roll</th>`;
	z += split > spare ? "<th rowspan='2'>Split</th>" : "";
	z += `</tr><tr><th rowspan="${pins}">1st roll</th><th>-</th>`;
	for(let col = 1; col <= pins - 1; col++) {
		z += `<td>${col}</td>`;
	}
	z += `<td>${Math.max(pins, spare)}</td></tr><tr>`;
	for(let row = 1; row <= pins - 1; row++) {
		for(let col = 0; col <= pins; col++) {
			let v = "";
			if(row + col == pins) v = Math.max(pins, row + spare);
			else if(row + col < pins) v = row + col;
			z += `<td>${v}</td>`;
		}
		if(split > spare) {
			let v = "";
			if(row > 0 && row < pins - 1) v = Math.max(pins, row + split);
			z += `<td>${v}</td>`;
		}
		z += "</tr><tr>";
	}
	z += `<th>Strike</th><td>${strike}</td>`;
	for(let col = 1; col <= pins; col++) {
		z += "<td></td>";
	}
	if(split > spare) z += "<td></td>";
	table.innerHTML = z + "</tr></tbody>";
};
updateScoring();
const addGame = () => {
	const li = document.createElement("li");
	li.innerHTML = `<button onclick="this?.parentElement?.remove?.();">X</button> <label>Game ${nextGameNumber++}: <input type="text" oninput="calculateScores();"/> <output>0</output></label>`;
	gamesList.appendChild(li);
};
const calculateScores = () => {
	const num = x => x === "-" ? 0 : +x;
	for(const li of gamesList.children) {
		const gameText = li.getElementsByTagName("input")[0].value;
		const frames = gameText.split(" ");
		let sum = 0;
		for(let i = 0; i < frames.length; i++) {
			const frame = frames[i];
			switch(frame.length) {
				case 0: break;
				case 1:
					if(frame === "X" || frame === "x") sum += strike;
					else sum += (i === frames.length - 1) ? num(frame) : NaN;
					break;
				case 2:
					if(frame[1] === "/") sum += Math.max(pins, num(frame[0]) + spare);
					else if(frame[1] === ":") sum += (i === frames.length - 1) ? num(frame[0]) : NaN;
					else {
						const s = num(frame[0]) + num(frame[1]);
						sum += s >= pins ? NaN : s;
					}
					break;
				case 3:
					if(frame[1] !== ":") sum = NaN;
					else if(frame[2] === "/") sum += Math.max(pins, num(frame[0]) + split);
					else {
						const s = num(frame[0]) + num(frame[2]);
						sum += s >= pins ? NaN : s;
					}
					break;
				default: sum = NaN;
			}
		}
		li.getElementsByTagName("output")[0].innerText = String(sum);
	}
};
calculateScores();
		</script>
	</body>
</html>
